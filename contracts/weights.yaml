# Tabelul unic de ponderi. Proprietar: laptop B. Valorile sunt puncte de plecare, se ajustează în etapa 5.
# Se aplică ÎNTREGULUI sistem: inputuri și predicții trec prin aceleași reguli. Apelul clientului e doar un alt input.

fiabilitate_sursa:        # intră în scorul oricărei propuneri și multiplică efectul asupra scorului unui element
  tableta_coordonate: 0.90
  formular: 0.75
  text_liber: 0.55
  apel_client: 0.25       # „nu am curent/net" poate însemna cădere, nu lipsă de rețea
  om_teren: 0.95          # decizia unui om dupa verificarea in teren (accepta/respinge o predictie)

scor:
  initial_element_kmz: 0.60       # nimeni nu l-a verificat recent, deci nu 1.0 (păstrat pentru compatibilitate)
  initial_retea_start: 0.90       # rețeaua de start (KMZ + puncte simulate hardcodate) e considerată reală; Sesiunea 3
  confirmare_teren: 0.25          # raport executat care confirmă elementul (înmulțit cu fiabilitate × calitatea potrivirii)
  factor_semnalat_teren: 0.5      # raport de teren doar „semnalat” (ex. defect găsit): tot dovedește că elementul există, la jumătate
  contradictie: -0.20             # input care contrazice elementul (înmulțit la fel)
  verificat_recent_zile: 30       # halou verde în UI: verificat în ultimele N zile (expus și ca `verificat_recent` în snapshot)
  scadere_per_30_zile: -0.05      # fără verificare; -0,07 făcea ca toată rețeaua neverificată să treacă sub prag în aceeași zi (~87 de zile)
  fereastra_conflict_zile: 45     # două rapoarte diferite despre aceeași proprietate în această fereastră = conflict
  minim: 0.0
  maxim: 1.0

# Scorul unei PROPUNERI (element nou, schimbare de proprietate, predicție): medie ponderată a factorilor
# de mai jos; dacă un factor lipsește (ex. nu avem traseu OSM), ponderile rămase se renormalizează.
propunere:
  pondere_fiabilitate_sursa: 0.25
  pondere_incredere_extractie: 0.25
  pondere_calitate_potrivire: 0.25
  pondere_urmeaza_strada: 0.25     # doar când există traseu OSM (etapa 6)
  factor_vecini_dedusi: 0.7        # calitatea potrivirii se înmulțește cu asta când vecinii nu sunt dați în raport

praguri:
  aplicat: 0.75        # peste: se aplică în model
  predictie: 0.40      # între predictie și aplicat: apare ca predicție neaplicată
  # sub predictie: de_verificat, nu se desenează ca element nou

potrivire:
  distanta_max_m: 15   # element apropiat dacă nu există ID
  distanta_max_apel_m: 40           # apelul vine din clădire, nu de pe linie: rază mai mare până la cel mai apropiat element
  distanta_max_element_nou_m: 2.5   # pentru nod lipsă / racord nou: peste această distanță față de un element existent, e element NOU, nu acela
  factor_zecimale_reparate: 0.7     # coordonate cu punctul zecimal pierdut (4427960 -> 44.27960), reparate
  factor_pozitie_din_vecini: 0.5    # nod lipsă fără coordonate: poziție dedusă la mijlocul dintre vecini
  calitate_dupa_id: 1.0
  calitate_dupa_coordonate: 0.7
  calitate_dupa_adresa: 0.4

# --- Sesiunea 2 (valori de pornire, necalibrate; proprietar B) ---
decizie_om:
  penalizare_metoda_la_respingere: 0.05   # scade încrederea în metoda care a propus predicția respinsă

mutare_fire:             # eveniment tip mutare_fire (sens giratoriu etc.)
  raza_m: 40
  max_elemente: 25       # plafon de elemente marcate „de verificat" pe eveniment
  scor_marcat: 0.35      # scorul maxim al unui element marcat (sub pragul de predicție 0,40 => de_verificat)
  calitate_propunere: 0.6   # calitatea potrivirii pentru traseul nou propus (zonă, nu element exact)
  factor_fara_strada: 0.8   # scorul propunerii se înmulțește cu asta când nu există stradă OSM

val_apeluri:             # mai multe apeluri din aceeași zonă pe aceeași fereastră cântăresc mai mult decât unul
  numar_min: 3
  fereastra_zile: 7
  plafon_semnal: 0.40    # semnalul negativ agregat nu depășește asta

racordare:               # eveniment tip cerere_racordare
  raza_nod_m: 150        # cel mai apropiat nod în care se poate racorda
  max_stalpi_prezisi: 8
  factor_fara_strada: 0.6   # scorul propunerii când nu există stradă OSM (linie dreaptă)
  # Locația operatorului (simulată, din textul lui): indiciu, nu măsurătoare. Scorul se înmulțește cu factorul;
  # rezultatul nu trece niciodată de „predicție" fără decizia omului.
  raza_extinsa_m: 400             # treapta 2: nod în raza extinsă
  prag_afisare: 0.15              # sub praguri.predictie dar peste asta: „predicție slabă” (nu neaplicat)
  factor_raza_extinsa: 0.7
  factor_linie_dreapta_lunga: 0.5 # treapta 3
  factor_doar_casa: 0.3           # treapta 4
  factor_locatie_operator: 0.8
  operator_distanta_min_m: 20     # punctul simulat e la cel puțin atât de cel mai apropiat nod (altfel nu e ce prezice)
  precizie_intersectie_m: 10      # precizia (± m) raportată după cât de vagă e zona descrisă
  precizie_strada_min_m: 15       # stradă: lungimea/20, între min și max
  precizie_strada_max_m: 40
  precizie_cartier_m: 60

trace:                   # locația din traseul tabletei (backend/trace, proprietar A)
  fereastra_min: 60
  raza_oprire_m: 12
  durata_min_min: 3      # sub asta nu e oprire
  distanta_strada_m: 40  # opririle candidate sunt la cel mult atât de strada potrivită cu adresa
  prag_ambiguitate_min: 3   # dacă primele două opriri diferă cu mai puțin, scorul scade
  factor_ambiguitate: 0.6
  factor_fara_strada: 0.7

demontat:                # eveniment tip activ_demontat
  rapoarte_min: 2        # echipe diferite necesare ca elementul să fie scos din uz
  fereastra_zile: 45     # rapoartele de demontare se combină (1 - produs(1 - scor)) în fereastra asta

# --- Sesiunea 3 (valori de pornire, necalibrate; proprietar B; zona reglabilă prin commit `reglaj:`) ---
zona:                    # safeguard: nimic nu iese din zona prototipului
  raza_max_m: 3000       # față de centroidul rețelei de start; în afară = eronat în cadrul prototipului

geocodare:               # backend.geo: acuratețea locației după cât de standardizat e textul
  acuratete:
    id_existent: 1.0
    coordonate: 0.7
    strada_numar: 0.45
    intersectie: 0.60
    strada: 0.40
    reper: 0.20
  factor_ai_fuzzy: 0.8   # decizia a luat-o AI (ortografie diferită/vag), nu potrivirea exactă
  precizie_strada_min_m: 25
  precizie_strada_max_m: 150
  precizie_numar_m: 200
  precizie_intersectie_m: 15
  precizie_reper_m: 120

standardizare:           # plafon pentru incredere_extractie după cel mai bun localizator din text
  plafon_dupa_localizator:
    id: 1.0
    coordonate: 0.9
    strada_numar: 0.7
    strada: 0.5
    reper: 0.3

trace_generat:           # traseu simulat generat la raport (backend.trace.genereaza_traseu); suprascriibil per raport
  puncte: 60
  zgomot_m: 5
  durata_oprire_min: 12
  acoperire: 0.9         # fracția de puncte păstrate
  decalaj_m: 0           # oprirea față de punctul din raport (0 = consistent)
  bonus_max: 0.15        # cât poate crește acuratețea locației
  durata_bonus_min: 5    # peste durata_min_min, atâtea minute dau bonusul maxim
  zgomot_max_bonus_m: 15 # peste, nu mai există bonus
  acoperire_min: 0.6     # sub, penalizare
  penalizare_acoperire: 0.1
  toleranta_adresa_m: 40 # oprire–adresă geocodată; peste = contradicție
  penalizare_contradictie: 0.25

# --- Sesiunea 4 (docs/plan-sesiune-4-prezentare.md; proprietar B). Valorile noi sunt de pornire, calibrate în faza 2. ---
acuratete:               # D6: GIS stabil, elementele din rapoarte plafonate după cum au fost localizate
  initial_gis: 0.95                    # rețeaua din KMZ (pusă de om în GIS)
  scadere_gis_per_30_zile: -0.01
  minim_gis: 0.85                      # scăderea în timp nu coboară GIS sub asta (contradicțiile pot)
  aplicat_raport_executat: 0.50        # P1: raport de teren executat (mentenanță/investiții) aplică de la acest scor

retea_start:             # P2: punctele simulate SIM-* = „din rapoarte mai vechi”, cu scoruri amestecate deterministe
  sim_din_rapoarte: 1                  # 1 = da, 0 = SIM-* tratate ca GIS
  fractie_galben: 0.45
  fractie_portocaliu: 0.35             # restul = roșu
  scor_galben: 0.68
  scor_portocaliu: 0.50
  scor_rosu: 0.34

plafon_locatie:          # D6: scorul maxim al unui element din raport, după sursa locației
  coordonate: 0.85
  id: 0.85
  adresa_numar: 0.70
  intersectie: 0.60
  strada: 0.55
  analiza_harta: 0.40
  reper: 0.35

culori:                  # D5: benzi de culoare; motorul scrie `banda`, UI-ul doar o afișează
  verde: 0.80
  galben: 0.60
  portocaliu: 0.40                     # sub = roșu

verificat_om:            # D10: „Marchează verificat de om” pe orice element
  scor: 1.0
  scadere_per_30_zile: -0.01
  minim: 0.95

cautare_strada:          # D11/V6: stradă + indiciu parțial („lângă nr. 15”) → fereastră pe stradă → elementele din ea
  metri_per_numar: 6                   # ~12 m la 2 numere (o parte a străzii)
  decalaj_paritate_m: 8
  precizie_ancore_m: 40
  precizie_conventie_m: 100
  fereastra_dupa_m: 60
  precizie_capat_m: 50
  latime_laterala_m: 15                # cât de departe de axul străzii se caută elemente
  calitate_cautare_unic: 0.6
  max_candidati_predictie: 4           # peste: „de verificat” pe fereastră, nu predicție
  factor_numere_conventie: 0.8         # înmulțește plafonul adresa_numar când nu avem ancore

analiza_harta:           # D4/V3: predicție pe graful de străzi OSM local, nu în linie dreaptă
  raza_cautare_m: 800
  candidati: 5
  pas_stalp_m: 40
  reutilizare_stalp_m: 10
  max_bransament_m: 40
  lungime_referinta_m: 400             # f = max(factor_min, exp(-L/lungime_referinta_m))
  factor_min: 0.30
  fara_drum: 0.25

mutare_fire_document:    # V4: fire mutate descrise doar în text (sens giratoriu), fără clic
  raza_intersectie_m: 60
  ocolire: 1                           # 1 = traseul nou ocolește centrul zonei pe străzi
  cost_strada_noua: 0.5                # drumurile pe strada numită în text costă mai puțin (preferate)

demo:                    # D7
  trace_generat_activ: 0               # 0 = motorul nu mai generează traseu la raport
