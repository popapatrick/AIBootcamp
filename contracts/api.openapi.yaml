openapi: 3.0.3
info:
  title: Grid model API (prototip, date fictive)
  version: 0.1.0
paths:
  /health:
    get:
      summary: Verificare
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
  /rapoarte:
    post:
      summary: Procesează un raport nou (extracție, potrivire, scor); întoarce pașii intermediari
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, sursa]
              properties:
                text: {type: string}
                sursa: {type: string, enum: [mentenanta, investitii, racordari, apel_client]}
                data: {type: string, format: date}
                locatie: {type: object, description: "lat/lon dintr-un clic pe hartă; sesiunea 4: NEUTILIZAT în UI (plasarea prin clic e scoasă), păstrat pentru teste", properties: {lat: {type: number}, lon: {type: number}}}
                locatie_operator: {type: object, description: "poziția SIMULATĂ a operatorului (din GET /locatie-operator-demo), pentru cerere_racordare fără coordonate și fără clic; `simulata` trebuie să fie true (altfel 422)", required: [lat, lon], properties: {lat: {type: number}, lon: {type: number}, precizie_m: {type: number}, simulata: {type: boolean, enum: [true]}, zona: {type: string}}}
      responses:
        "200":
          description: "StepTrace (vezi contracts/interfaces.md), cu `schimbari` structurate. Sesiunea 4: și `standardizare` {metoda, campuri[{camp, eticheta, valoare, din: text|dedus|lipsa}], lipsa[], localizare{sursa, metoda, indiciu, precizie_m, plafon, text}, decizie{cod, text, scor, banda}} și `focus` {lat, lon, zoom, bbox}; pași noi posibili: `cautare_strada`, `analiza_harta`"
          content: {application/json: {schema: {type: object}}}
  /locatie-operator-demo:
    get:
      summary: "Poziție GPS DUMMY a operatorului, generată determinist din textul lui, în zona descrisă (stradă, colț, cartier). Mereu `simulata: true`; nu inventează puncte"
      parameters:
        - {name: text, in: query, required: false, schema: {type: string}, description: "descrierea operatorului, ex. „strada X colț cu strada Y” sau „strada X din cartierul Z”; obligatoriu dacă lipsește `adresa`"}
        - {name: adresa, in: query, required: false, schema: {type: string}, description: "alias pentru `text`"}
        - {name: lat, in: query, required: false, schema: {type: number}, description: "indiciu opțional: se alege punctul posibil cel mai apropiat de el"}
        - {name: lon, in: query, required: false, schema: {type: number}}
      responses:
        "200":
          description: "{lat, lon, precizie_m, simulata: true, strada, motiv, indicii: [{tip: strada|intersectie|cartier|reper, valoare, gasit}], zona}"
          content: {application/json: {schema: {type: object, properties: {lat: {type: number}, lon: {type: number}, precizie_m: {type: number}, simulata: {type: boolean, enum: [true]}, strada: {type: string, nullable: true}, motiv: {type: string}, zona: {type: string}, indicii: {type: array, items: {type: object, properties: {tip: {type: string, enum: [strada, intersectie, cartier, reper]}, valoare: {type: string}, gasit: {type: boolean}}}}}}}}
        "422": {description: "textul lipsește sau niciun indiciu nu se găsește în datele locale; `detail` = {mesaj, indicii: [{tip, valoare, gasit: false}]}. UI-ul cere clic pe hartă"}
  /geocodeaza:
    get:
      summary: "Sesiunea 3: coordonate aproximative din adresă/stradă (backend.geo, doar cache OSM local + AI); depanare"
      parameters:
        - {name: adresa, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: gasit|necunoscut, lat, lon, precizie_m, metoda: osm_cache|ai_estimare, acuratete, motiv}", content: {application/json: {schema: {type: object}}}}
  /reguli:
    get:
      summary: "Sesiunea 3: valorile curente din contracts/weights.yaml, read-only (nu există scriere prin API)"
      responses:
        "200": {description: weights.yaml ca JSON, content: {application/json: {schema: {type: object}}}}
  /retea:
    get:
      summary: Starea rețelei la o dată (GeoJSON, properties = ElementState; Sesiunea 3 - cheia `zona` {centru:{lat,lon}, raza_m} în răspuns, `origine` pe elemente; sesiunea 4 - pe fiecare feature `banda`, `verificat_om`, `verificat_om_data`, `sursa_locatie`, `t0`, `eticheta_origine` (GIS | Din raport); fără scenariul extrem)
      parameters:
        - {name: data, in: query, required: false, schema: {type: string, format: date}}
      responses:
        "200": {description: GeoJSON FeatureCollection, content: {application/json: {schema: {type: object}}}}
  /evenimente:
    get:
      summary: "Lista pentru timeline. Fiecare element are `tip` (tipul evenimentului) și `eticheta` (mutare_fire, demontat, val_apeluri, racordare, decizie_om, verificat_om, tracking, stergere sau egală cu tipul). Sesiunea 4: fără scenariul extrem; fiecare intrare are și `text_original`, `echipa` (etichetă română), `standardizare`, `banda_inainte`, `banda_dupa`, `focus`"
      parameters:
      responses:
        "200": {description: lista, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /element/{id}:
    get:
      summary: Istoricul unui element și „de ce"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: ElementState + istoric, content: {application/json: {schema: {type: object}}}}
        "404": {description: necunoscut}
  /exemple:
    get:
      summary: Texte dummy pentru butonul Generează exemplu (din data/reports/exemple-dummy.json)
      parameters:
        - {name: sursa, in: query, required: true, schema: {type: string, enum: [mentenanta, investitii, racordari]}, description: "sesiunea 4: doar cele 3 echipe (D9)"}
      responses:
        "200": {description: lista de texte, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /predictii/{id}/decizie:
    post:
      summary: Decizia omului asupra unei predicții (eveniment verificare, sursa om_teren)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [decizie], properties: {decizie: {type: string, enum: [accepta, respinge]}, motiv: {type: string}, data: {type: string, format: date}}}}}
      responses:
        "200": {description: StepTrace, content: {application/json: {schema: {type: object}}}}
        "409": {description: predicția are deja o decizie (eroare.cod deja_decis)}
        "404": {description: predicție necunoscută (eroare.cod necunoscut)}
        "422": {description: corp invalid (decizie diferită de accepta/respinge)}
        "501": {description: motorul real nu e disponibil (mod stub)}
  /element/{id}/verificare:
    post:
      summary: "Sesiunea 4 (D10): un om marchează elementul verificat în teren (eveniment verificare_om); scor weights.verificat_om.scor, insignă; pe o predicție o și aplică"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {motiv: {type: string}, data: {type: string, format: date}}}}}
      responses:
        "200": {description: StepTrace, content: {application/json: {schema: {type: object}}}}
        "404": {description: element necunoscut}
  /element/{id}/stergere:
    post:
      summary: "Etapa 34: un om șterge un element adăugat de sistem (eveniment stergere_om, echipa_sursa om_teren). Se șterge tot grupul (stâlp + legăturile lui, sau legătură + stâlpii rămași fără alte legături); elementele sunt retrase cu jurnal (dispar de pe hartă de la data ștergerii, rămân la datele anterioare), fără penalizare de metodă. Se pot șterge: predicțiile punctate (NOU-/MUT-/PLAN-/TRK-), elementele aplicate din rapoarte/tracking, pinurile VER-*. NU se pot șterge elementele rețelei de start (GIS și SIM-*: `stergibil: false`)."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, properties: {motiv: {type: string}, data: {type: string, format: date}}}}}
      responses:
        "200": {description: "StepTrace: `decizie: sters`, `schimbari[].ce = sters` pe fiecare element din grup, `stergere {tinta_id, elemente[], n, motiv}`, pasul `scor` cu `grup`. UI-ul spune câte elemente s-au șters (`stergere.n`).", content: {application/json: {schema: {type: object}}}}
        "409": {description: "refuz (StepTrace cu `decizie: neaplicat`, `eroare.cod`): `nu_se_sterge_retea_start` (GIS/SIM-*) sau `deja_sters` (deja șters sau retras)"}
        "404": {description: "element necunoscut (eroare.cod necunoscut)"}
        "501": {description: motorul real nu e disponibil (mod stub)}
  /demo/exemple:
    get:
      summary: "Sesiunea 4: cardurile paginii de intro (data/reports/demo-intro.json)"
      responses:
        "200": {description: "listă {id, titlu, descriere, sursa, text, data_moment, focus {lat, lon, zoom}}", content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /demo/reset:
    post:
      summary: "Sesiunea 4 (P4): modelul revine la starea de start + scenariul timeline, fără repornirea serverului"
      responses:
        "200": {description: "{status: ok, evenimente: N}", content: {application/json: {schema: {type: object}}}}
  /legenda:
    get:
      summary: "Sesiunea 4: benzile de culoare (din weights.culori), stilurile de linie și insignele, cu texte în română"
      responses:
        "200": {description: "{benzi: [{banda, de_la, culoare, text}], linii: [{stil, text}], insigne: [{cod, text}]}", content: {application/json: {schema: {type: object}}}}
  /tracking/genereaza:
    post:
      summary: "Sesiunea 4b: generează o tură simulată a tabletei unei echipe (3–5 stâlpi existenți + un loc fără stâlp, pe străzi, determinist pe seed). NU schimbă modelul."
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [echipa], properties: {echipa: {type: string, enum: [mentenanta, investitii, racordari]}, seed: {type: string, description: "implicit `<echipa>-<data>`"}, data: {type: string, format: date}}}}}
      responses:
        "200": {description: "tura: {tura_id, echipa, data, seed, puncte: [{t, lat, lon}], plan: [{lat, lon, durata_min, tip_plan: stalp|fara_stalp|scurta, element_id?}], lungime_m, durata_min}. `plan` e doar pentru depanare; motorul detectează singur opririle", content: {application/json: {schema: {type: object}}}}
        "422": {description: echipă necunoscută sau dată invalidă}
  /tracking/aplica:
    post:
      summary: "Sesiunea 4b: aplică o tură în model (eveniment tracking_tura, sursa tracking_gps). Opririle se detectează din puncte; validare = stâlp confirmat, oprire lungă fără stâlp = stâlp presupus (predicție punctată TRK-*)"
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {tura_id: {type: string, description: "o tură generată (sau din scenariu) cunoscută de server"}, tura: {type: object, description: "sau tura întreagă, ca la /tracking/genereaza"}, data: {type: string, format: date}}}}}
      responses:
        "200": {description: "StepTrace (vezi contracts/interfaces.md) + `tracking`: [{lat, lon, inceput, durata_min, tip: validare|stalp_presupus|scurta|neclara, element_id?, scor_inainte?, scor_dupa?, banda_inainte?, banda_dupa?, t_ajungere}] (t_ajungere = secunde de la începutul turei, ca UI-ul să dezvăluie rezultatul când tableta ajunge la oprire) + `focus` {lat, lon, zoom, bbox} al turei. Aplicată a doua oară = fără dublare", content: {application/json: {schema: {type: object}}}}
        "404": {description: tura_id necunoscut}
        "422": {description: corp invalid (nici tura_id, nici tura)}
        "501": {description: motorul real nu e disponibil (mod stub)}
  /tracking/ture:
    get:
      summary: "Sesiunea 4b: turele generate în sesiunea curentă și cele din scenariu (fără puncte, doar rezumat)"
      responses:
        "200": {description: "listă {tura_id, echipa, data, seed, aplicata: bool, durata_min, lungime_m, n_puncte}", content: {application/json: {schema: {type: array, items: {type: object}}}}}
